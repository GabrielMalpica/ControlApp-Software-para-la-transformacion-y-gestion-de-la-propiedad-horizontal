name: flutter_application_1
description: "ControlApp: app de Control Limpieza S.A.S. (web y Android)."
publish_to: 'none'

# versionName+versionCode. Subir el +N en cada APK que se publique en
# /descargas/: la app compara versionCode con android.json para actualizarse.
version: 1.1.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  http: ^1.2.2
  http_parser: ^4.1.2
  intl: 0.20.2
  cupertino_icons: ^1.0.8
  table_calendar: ^3.2.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  pdf: ^3.11.0
  printing: ^5.13.0
  image_picker: ^1.0.7
  file_picker: ^10.3.10
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^28.2.12
  collection: ^1.18.0
  path: ^1.9.0
  url_launcher: ^6.3.2
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  geolocator: ^13.0.2
  sembast: ^3.8.10
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
  image: ^4.9.2
  sembast_web: ^2.4.6
  workmanager: ^0.10.10
  package_info_plus: ^9.0.1
  ota_update: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# Íconos del lanzador de Android desde los de la web. Regenerar con
# `dart run flutter_launcher_icons` (desde controlapp_frontend/).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "web/icons/control-512.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "web/icons/control-maskable-512.png"
  # El ícono "maskable" ya trae su margen: sin inset extra el logo no queda
  # diminuto dentro del círculo/cuadrado del lanzador.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 23

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/logo_cronograma.png
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/templates/Informe_de_Gestion_plantilla.pdf
    - assets/payment/
