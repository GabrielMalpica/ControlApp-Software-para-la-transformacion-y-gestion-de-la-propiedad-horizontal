<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ControlApp - Control Limpieza S.A.S.">
  <meta name="theme-color" content="#0C6B43">

  <!--
    Íconos con el logo de Control S.A.S. (web/icons/control-*.png). Si se
    cambia el logo, usar nombres de archivo nuevos: los celulares y Hostinger
    guardan los íconos en caché por su nombre.
  -->
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ControlApp">
  <link rel="apple-touch-icon" href="icons/control-apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/control-favicon.png"/>

  <title>ControlApp</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    El arranque (web/flutter_bootstrap.js) va dentro de esta página y no como
    archivo aparte: así no queda una copia vieja en la caché del navegador que
    siga cargando la versión anterior de la app.
  -->
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
