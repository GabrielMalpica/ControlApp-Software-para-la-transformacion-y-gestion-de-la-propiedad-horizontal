# Compila la web y el APK de Android en la misma versión y los publica en
# Hostinger (ver docs/app-android-sin-conexion.md, "Publicar una versión").
# Un clic: Actions → "App Android y web" → Run workflow. El versionCode se
# calcula solo (el publicado + 1, nunca menos que el número de la ejecución):
# no hay que editar pubspec.yaml.
#
# Secretos (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD: llave de firma (obligatorios).
#   HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USER, HOSTINGER_FTP_PASSWORD,
#   HOSTINGER_FTP_DIR: para publicar (obligatorios salvo que se desmarque
#   "publicar"; sin ellos antes el run terminaba bien sin subir nada y el
#   enlace de descarga de la web no funcionaba).
# Variables opcionales: HOSTINGER_FTP_PROTOCOL (ftps por defecto; ftp si
# Hostinger no acepta TLS) y HOSTINGER_FTP_SECURITY (strict por defecto; loose
# si el certificado del FTP no coincide con el nombre del servidor).

name: App Android y web

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API que usan la web y la app (API_BASE_URL)
        type: string
        default: https://thriving-empathy-production-2f17.up.railway.app
      descargas_base_url:
        description: Dónde queda publicada la web (para la URL del APK en android.json)
        type: string
        default: https://controlapp.controlsas.com.co
      minima_version_code:
        description: versionCode mínimo permitido (vacío = 1). Mayor obliga a actualizar a quien tenga una versión anterior
        type: string
        required: false
        default: ""
      notas:
        description: Qué cambió (se muestra al ofrecer la actualización)
        type: string
        required: false
        default: ""
      publicar:
        description: Subir a Hostinger por FTP (desmarcar solo para compilar y descargar el artefacto)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: app-android
  cancel-in-progress: false

jobs:
  compilar:
    name: Compilar web y APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: controlapp_frontend
    env:
      API_BASE_URL: ${{ inputs.api_base_url }}
      DESCARGAS_BASE_URL: ${{ inputs.descargas_base_url }}
      MINIMA_VERSION_CODE: ${{ inputs.minima_version_code }}
      NOTAS: ${{ inputs.notas }}
      PUBLICAR: ${{ inputs.publicar }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Revisar entradas
        run: |
          set -euo pipefail
          for nombre in API_BASE_URL DESCARGAS_BASE_URL; do
            valor="${!nombre:-}"
            if [[ ! "$valor" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[^?#[:space:]]*)?$ ]]; then
              echo "::error::$nombre debe ser una URL https sin ? ni #, llegó \"$valor\"."
              exit 1
            fi
          done
          if [[ -n "$MINIMA_VERSION_CODE" && ! "$MINIMA_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::minima_version_code debe ser un número entero o quedar vacío."
            exit 1
          fi

      - name: Revisar secretos de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          faltan=()
          for nombre in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!nombre:-}" ]] || faltan+=("$nombre")
          done
          if (( ${#faltan[@]} )); then
            echo "::error::Faltan los secretos ${faltan[*]} (Settings → Secrets and variables → Actions). Sin la llave no se puede firmar el APK."
            exit 1
          fi
          # key.properties es un archivo de propiedades de Java: "\" y saltos
          # de línea cambiarían el valor.
          for nombre in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ "${!nombre:-}" == *\\* || "${!nombre:-}" == *$'\n'* ]]; then
              echo "::error::El secreto $nombre no puede tener \\ ni saltos de línea."
              exit 1
            fi
          done

      - name: Revisar FTP de Hostinger
        id: ftp
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_FTP_DIR: ${{ secrets.HOSTINGER_FTP_DIR }}
        run: |
          set -euo pipefail
          hay=(); faltan=()
          for nombre in HOSTINGER_FTP_SERVER HOSTINGER_FTP_USER HOSTINGER_FTP_PASSWORD HOSTINGER_FTP_DIR; do
            if [[ -n "${!nombre:-}" ]]; then hay+=("$nombre"); else faltan+=("$nombre"); fi
          done
          if [[ "$PUBLICAR" != "true" ]]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Solo compilar: el artefacto queda para subirlo a mano."
            exit 0
          fi
          if (( ${#faltan[@]} )); then
            # Antes esto era un aviso y el run terminaba "bien" sin publicar
            # nada: la web quedaba sin descargas/ y el enlace de la app volvía
            # al inicio.
            echo "::error::Faltan los secretos ${faltan[*]} para publicar en Hostinger (Settings → Secrets and variables → Actions; pasos en docs/app-android-sin-conexion.md). Para solo compilar, desmarca \"publicar\"."
            exit 1
          fi
          if [[ "$HOSTINGER_FTP_DIR" != */ ]]; then
            echo "::error::HOSTINGER_FTP_DIR debe terminar en / (por ejemplo public_html/)."
            exit 1
          fi
          echo "configurado=true" >> "$GITHUB_OUTPUT"
          echo "Se subirá build/web a Hostinger por FTP al final."

      # versionCode = el mayor entre el publicado + 1, el de pubspec.yaml y el
      # número de esta ejecución: los celulares solo se actualizan si el número
      # sube. El número de la ejecución cubre el caso en que el android.json
      # publicado desaparece (pasó el 20 nov: se volvió a compilar la 2, que los
      # celulares ya tenían).
      - name: Calcular versión
        id: version
        run: >-
          node scripts/empaquetar-android.js --solo-revisar --auto-version
          --base-url "$DESCARGAS_BASE_URL"
          --minima "$MINIMA_VERSION_CODE"
          --version-code-minimo "$GITHUB_RUN_NUMBER"
          --anterior "${DESCARGAS_BASE_URL%/}/descargas/android.json"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            controlapp_frontend/android/*.gradle*
            controlapp_frontend/android/app/*.gradle*
            controlapp_frontend/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Prueba de empaquetar-android.js
        run: node scripts/empaquetar-android.test.js

      - name: Compilar web
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: flutter build web --release --build-number="$VERSION_CODE" --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Content-Security-Policy
        run: |
          set -euo pipefail
          node scripts/csp-web.js --api "$API_BASE_URL"
          if ! git diff --quiet -- web/.htaccess; then
            echo "::warning file=controlapp_frontend/web/.htaccess::El hash del arranque cambió: build/web ya va bien, pero corre node scripts/csp-web.js localmente y haz commit de web/.htaccess."
          fi

      - name: Preparar llave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/upload-keystore.p12
          if [[ ! -s android/app/upload-keystore.p12 ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 no es un base64 válido de la llave."
            exit 1
          fi
          {
            echo "storeFile=upload-keystore.p12"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "storeType=pkcs12"
          } > android/key.properties
          # Que abra con la contraseña y tenga el alias, antes de compilar.
          if ! keytool -list -keystore android/app/upload-keystore.p12 -storetype PKCS12 \
              -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null; then
            echo "::error::La llave no abre con ANDROID_KEYSTORE_PASSWORD o no tiene el alias ANDROID_KEY_ALIAS."
            exit 1
          fi

      - name: Compilar APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: flutter build apk --release --build-number="$VERSION_CODE" --dart-define=API_BASE_URL="$API_BASE_URL"

      # Si Gradle no tomó key.properties firmaría con la llave de depuración, y
      # los celulares que la instalen no podrían actualizarse después.
      - name: Revisar la firma del APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          apk=build/app/outputs/flutter-apk/app-release.apk
          esperado="$(keytool -exportcert -keystore android/app/upload-keystore.p12 -storetype PKCS12 \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            | sha256sum | cut -d' ' -f1)"
          firmas="$("$apksigner" verify --print-certs "$apk")"
          if ! grep -qi "certificate SHA-256 digest: $esperado" <<< "$firmas"; then
            echo "::error::El APK no quedó firmado con la llave de ControlApp (¿android/app/build.gradle.kts lee key.properties?)."
            echo "$firmas"
            exit 1
          fi
          echo "APK firmado con la llave de ControlApp (certificado SHA-256 $esperado)."

      - name: Empaquetar APK en build/web/descargas
        id: empaquetar
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: >-
          node scripts/empaquetar-android.js
          --version-code "$VERSION_CODE"
          --base-url "$DESCARGAS_BASE_URL"
          --minima "$MINIMA_VERSION_CODE"
          --notas "$NOTAS"
          --anterior "${DESCARGAS_BASE_URL%/}/descargas/android.json"

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: controlapp-web-${{ steps.empaquetar.outputs.version_name }}+${{ steps.empaquetar.outputs.version_code }}
          path: controlapp_frontend/build/web
          # .htaccess (rutas, caché y CSP) empieza con punto: sin esto no se incluye.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      # Primero todo menos descargas/android.json: si la subida se corta, los
      # celulares no ven una versión cuyo APK aún no está en el servidor.
      # El FTP de Hostinger a veces corta la conexión (ECONNRESET): un
      # reintento después de una pausa. Lo ya subido no se pierde.
      - name: Subir a Hostinger por FTP
        id: ftp_web
        if: steps.ftp.outputs.configurado == 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_FTP_DIR }}
          protocol: ${{ vars.HOSTINGER_FTP_PROTOCOL || 'ftps' }}
          security: ${{ vars.HOSTINGER_FTP_SECURITY || 'strict' }}
          local-dir: controlapp_frontend/build/web/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            descargas/android.json

      - name: Esperar antes de reintentar la subida
        if: steps.ftp_web.outcome == 'failure'
        run: |
          echo "::warning::La subida por FTP falló; se reintenta una vez en 30 s."
          sleep 30

      - name: Subir a Hostinger por FTP (reintento)
        if: steps.ftp_web.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_FTP_DIR }}
          protocol: ${{ vars.HOSTINGER_FTP_PROTOCOL || 'ftps' }}
          security: ${{ vars.HOSTINGER_FTP_SECURITY || 'strict' }}
          local-dir: controlapp_frontend/build/web/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            descargas/android.json

      # android.json va de último y aparte, con curl. Antes iba con
      # FTP-Deploy-Action y un archivo de estado propio: el 20 nov ese estado y
      # android.json ya no estaban en el servidor, la acción intentó "primera
      # publicación" y Hostinger cortó la conexión (ECONNRESET). Para un solo
      # archivo no hace falta estado, y curl reintenta con una conexión nueva.
      - name: Subir android.json (aviso de versión nueva)
        if: steps.ftp.outputs.configurado == 'true'
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_FTP_DIR: ${{ secrets.HOSTINGER_FTP_DIR }}
          FTP_PROTOCOLO: ${{ vars.HOSTINGER_FTP_PROTOCOL || 'ftps' }}
          FTP_SEGURIDAD: ${{ vars.HOSTINGER_FTP_SECURITY || 'strict' }}
        run: bash scripts/subir-android-json.sh build/web/descargas/android.json

      # Comprueba que lo publicado es lo que se acaba de compilar (el CDN de
      # Hostinger puede tardar un poco: se reintenta).
      - name: Comprobar la descarga publicada
        if: steps.ftp.outputs.configurado == 'true'
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          base="${DESCARGAS_BASE_URL%/}/descargas"
          for intento in 1 2 3 4 5 6; do
            publicado="$(curl -fsS -H 'Cache-Control: no-cache' "$base/android.json?v=$GITHUB_RUN_ID" | node -e 'let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{try{console.log(JSON.parse(t).versionCode)}catch{console.log("")}})' || true)"
            tipo="$(curl -fsSI "$base/controlapp.apk?v=$GITHUB_RUN_ID" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}' || true)"
            if [[ "$publicado" == "$VERSION_CODE" && "$tipo" == application/vnd.android.package-archive* ]]; then
              echo "Publicado: versionCode $publicado y controlapp.apk ($tipo)."
              exit 0
            fi
            echo "Intento $intento: android.json=$publicado, controlapp.apk=$tipo; se reintenta en 20 s."
            sleep 20
          done
          echo "::error::Hostinger no muestra la versión $VERSION_CODE en $base (android.json=$publicado, controlapp.apk=$tipo). Revisa HOSTINGER_FTP_DIR: debe ser la carpeta donde está index.html."
          exit 1

      - name: Resumen
        if: steps.empaquetar.outcome == 'success'
        env:
          SUBIDO: "${{ steps.ftp.outputs.configurado == 'true' && 'sí, por FTP (comprobado)' || 'no, descargar el artefacto y subirlo a mano' }}"
        run: |
          set -euo pipefail
          node -e '
            const a = require("./build/web/descargas/android.json");
            const filas = [
              ["Versión", `${a.versionName}+${a.versionCode}`],
              ["Mínima", a.minimaVersionCode],
              ["APK", a.url],
              ["sha256", "`" + a.sha256 + "`"],
              ["Tamaño", `${(a.tamanoBytes / 1048576).toFixed(1)} MB`],
              ["API", process.env.API_BASE_URL],
              ["Subido a Hostinger", process.env.SUBIDO],
            ];
            console.log(["## App Android y web", "", "| | |", "|---|---|", ...filas.map(([k, v]) => `| ${k} | ${v} |`)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar llave de firma
        if: always()
        working-directory: .
        run: rm -f controlapp_frontend/android/app/upload-keystore.p12 controlapp_frontend/android/key.properties
